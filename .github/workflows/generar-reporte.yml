name: Generar y Publicar Reporte de Actividad

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obligatorio para que Git pueda calcular los diffs y el log

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar script analizador en Python
        run: |
          python .github/scripts/analizador.py

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4
        
